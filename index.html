<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Probabilidades</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="fondo" aria-hidden="true">
    <span class="burbuja burbuja-1"></span>
    <span class="burbuja burbuja-2"></span>
    <span class="burbuja burbuja-3"></span>
    <span class="burbuja burbuja-4"></span>
  </div>

  <main class="tarjeta">
    <header class="cabecera">
      <div class="escena">
        <div class="figura figura-moneda activa" id="figura-moneda">
          <div class="flota">
            <svg viewBox="0 0 120 120" class="ilustracion" role="img" aria-label="Moneda">
              <circle cx="60" cy="60" r="52" class="moneda-borde"></circle>
              <circle cx="60" cy="60" r="43" class="moneda-cara"></circle>
              <circle cx="47" cy="53" r="5" class="ojo"></circle>
              <circle cx="73" cy="53" r="5" class="ojo"></circle>
              <path d="M44 70 q16 14 32 0" class="sonrisa"></path>
            </svg>
          </div>
        </div>

        <div class="figura figura-dado" id="figura-dado">
          <div class="flota">
            <svg viewBox="0 0 120 120" class="ilustracion" role="img" aria-label="Dado de 6 caras">
              <rect x="16" y="16" width="88" height="88" rx="20" class="dado-cuerpo"></rect>
              <circle cx="42" cy="42" r="8" class="pipa-grande"></circle>
              <circle cx="78" cy="42" r="8" class="pipa-grande"></circle>
              <circle cx="60" cy="60" r="8" class="pipa-grande"></circle>
              <circle cx="42" cy="78" r="8" class="pipa-grande"></circle>
              <circle cx="78" cy="78" r="8" class="pipa-grande"></circle>
            </svg>
          </div>
        </div>

        <div class="figura figura-urna" id="figura-urna">
          <div class="flota">
            <svg viewBox="0 0 120 120" class="ilustracion" role="img" aria-label="Urna con bolas de colores">
              <rect x="30" y="38" width="60" height="64" rx="18" class="urna-cuerpo"></rect>
              <rect x="24" y="26" width="72" height="14" rx="7" class="urna-tapa"></rect>
              <circle cx="47" cy="78" r="10" class="bola-urna bola-urna-roja"></circle>
              <circle cx="68" cy="84" r="10" class="bola-urna bola-urna-azul"></circle>
              <circle cx="76" cy="64" r="9" class="bola-urna bola-urna-amarilla"></circle>
            </svg>
          </div>
        </div>
      </div>

      <h1>Simulador de Probabilidades</h1>
      <p class="subtitulo">Compara la probabilidad teórica con los resultados experimentales.</p>
    </header>

    <form id="formulario">
      <div class="campo">
        <label for="experimento">Experimento</label>
        <select id="experimento">
          <option value="moneda">Moneda</option>
          <option value="dado">Dado de 6 caras</option>
          <option value="urna">Sacar bolas de una urna</option>
        </select>
      </div>

      <div class="campo">
        <label for="simulaciones">Número de simulaciones</label>
        <input type="number" id="simulaciones" value="1000" inputmode="numeric">
      </div>

      <fieldset class="urna" id="urna" hidden>
        <legend>Composición de la urna</legend>
        <div class="urna-filas">
          <div class="urna-fila">
            <span class="muestrario"><span class="bola-muestra bola-rojo"></span> Rojo</span>
            <input type="number" name="bola-rojo" data-color="Rojo" value="5" inputmode="numeric" aria-label="Número de bolas rojas">
          </div>
          <div class="urna-fila">
            <span class="muestrario"><span class="bola-muestra bola-azul"></span> Azul</span>
            <input type="number" name="bola-azul" data-color="Azul" value="3" inputmode="numeric" aria-label="Número de bolas azules">
          </div>
          <div class="urna-fila">
            <span class="muestrario"><span class="bola-muestra bola-verde"></span> Verde</span>
            <input type="number" name="bola-verde" data-color="Verde" value="0" inputmode="numeric" aria-label="Número de bolas verdes">
          </div>
          <div class="urna-fila">
            <span class="muestrario"><span class="bola-muestra bola-amarillo"></span> Amarillo</span>
            <input type="number" name="bola-amarillo" data-color="Amarillo" value="0" inputmode="numeric" aria-label="Número de bolas amarillas">
          </div>
          <div class="urna-fila">
            <span class="muestrario"><span class="bola-muestra bola-naranja"></span> Naranja</span>
            <input type="number" name="bola-naranja" data-color="Naranja" value="0" inputmode="numeric" aria-label="Número de bolas naranjas">
          </div>
          <div class="urna-fila">
            <span class="muestrario"><span class="bola-muestra bola-morado"></span> Morado</span>
            <input type="number" name="bola-morado" data-color="Morado" value="0" inputmode="numeric" aria-label="Número de bolas moradas">
          </div>
        </div>
      </fieldset>

      <button type="submit" id="boton-simular">Simular</button>
    </form>

    <p id="error" class="error" hidden></p>

    <section id="resultados" hidden>
      <p class="total">Total de simulaciones: <strong id="total"></strong></p>
      <div id="filas" class="tarjetas"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
